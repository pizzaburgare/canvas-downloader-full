[project]
name = "canvas-downloader-full"
version = "0.1.0"
description = "Download entire Canvas courses (files, pages, modules, assignments, videos) via a logged-in browser session"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "textual>=0.80",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
canvas-dl = "canvas_downloader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_downloader"]
